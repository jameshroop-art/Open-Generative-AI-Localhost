# Project-level pip configuration for Open Generative AI.
#
# pip reads this file when the PIP_CONFIG_FILE environment variable points to
# it (set automatically by the Electron launcher and by the setup scripts).
#
# All .whl files required by python/requirements.txt should be placed in the
# directory specified by `find-links`.  pip will install from there first and
# fall back to PyPI only if a matching wheel is not found locally.
#
# To disable the PyPI fallback and install exclusively from local wheels, set
# the WHEELS_NO_INDEX environment variable to any non-empty value, or
# uncomment the line below:
#   no-index = true

[global]
find-links = H:\Models-D1\wheels
prefer-binary = true
